[package]
name = "la-app"
version = "0.1.0"
description = "The logic analyzer application: a thin iced shell over the host API"
edition.workspace = true
# The user-interface dependency tree needs a newer compiler than the core crates (see
# specs/006-ui-shell-signal-view/research.md R12/R13). The MSRV job builds everything else.
rust-version = "1.92"
license.workspace = true
publish.workspace = true

[[bin]]
name = "logic-analyzer"
path = "src/main.rs"

[dependencies]
iced = { version = "0.14.0", features = ["canvas", "tokio"] }
la-devices = { path = "../devices" }
la-driver-weact = { path = "../driver-weact" }
la-driver-rp2350b = { path = "../driver-rp2350b" }
la-diagnostics = { path = "../diagnostics" }
la-host = { path = "../host" }
la-decoders = { path = "../decoders" }
la-i18n = { path = "../i18n" }
rfd = "0.18.0"
tracing = "0.1.44"

[dev-dependencies]
iced_test = "0.14.0"
read-fonts = "0.35.0"
la-host = { path = "../host", features = ["test-support"] }
la-session = { path = "../session" }
la-decoders = { path = "../decoders", features = ["test-support"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.31"

[lints]
workspace = true
