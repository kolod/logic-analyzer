[package]
name = "la-decoders"
version = "0.1.0"
description = "Protocol decoder framework: annotations, indexed results, background execution, stacking"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
la-core = { path = "../core" }
la-devices = { path = "../devices" }
la-diagnostics = { path = "../diagnostics" }
la-storage = { path = "../storage" }
tracing = "0.1.44"

[features]
# Decoders that fail on purpose (fault injection) and test helpers. Not part of the stable API.
test-support = []

[dev-dependencies]
la-decoders = { path = ".", features = ["test-support"] }
la-devices = { path = "../devices", features = ["test-support"] }

[lints]
workspace = true
