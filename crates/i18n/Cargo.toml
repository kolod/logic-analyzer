[package]
name = "la-i18n"
version = "0.1.0"
description = "Localization: messages, plurals, locale formatting and the translation parity check"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
fluent-bundle = "0.16.0"
fluent-syntax = "0.12.0"
la-core = { path = "../core" }
la-diagnostics = { path = "../diagnostics" }
sys-locale = "0.3.2"
tracing = "0.1.44"
unic-langid = "0.9.6"

[features]
# The translation parity check (parses the resources and scans the sources).
check = []
# Constructors that build a localizer from in-memory sources, for tests.
test-support = []

[dev-dependencies]
la-i18n = { path = ".", features = ["check", "test-support"] }
la-devices = { path = "../devices" }
la-session = { path = "../session" }
la-storage = { path = "../storage" }

[[bench]]
name = "lookup"
harness = false

[lints]
workspace = true
