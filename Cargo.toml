[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-only"
publish = false

# Containing worker panics (constitution Principle I) requires unwinding. Never change
# this to "abort".
[profile.dev]
panic = "unwind"
debug = "line-tables-only"

[profile.release]
panic = "unwind"

# Panic-safety policy (constitution Principle I, spec FR-009..FR-011).
# Production code MUST NOT panic on external input. Tests are relaxed in clippy.toml.
# An exception needs a local `#[allow(..., reason = "...")]` with a justification.
[workspace.lints.rust]
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = [
  "cfg(lint_fixture_unwrap)",
  "cfg(lint_fixture_expect)",
  "cfg(lint_fixture_index)",
  "cfg(lint_fixture_arith)",
  "cfg(lint_fixture_panic)",
  "cfg(lint_fixture_unsafe)",
] }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
