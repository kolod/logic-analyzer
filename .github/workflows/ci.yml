# CI gate. See specs/001-workspace-ci-foundation/contracts/ci-checks.md.
#
# Every Rust job runs on both supported operating systems:
#   windows - the hosted Windows runner (stand-in for Windows 10/11)
#   debian  - Debian 13 ("trixie") in a container on the hosted Ubuntu runner
# Third-party actions are pinned by full commit SHA; the Rust toolchain is pinned in
# rust-toolchain.toml. Changing either is a deliberate, reviewed change.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly: a newly published advisory must surface even without a code change.
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Line tables are enough for a backtrace; full debug information only makes the builds, the linking
  # (slow on Windows) and the cache larger. The test profile inherits from dev.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  fmt:
    name: fmt (${{ matrix.name }})
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, os: windows-latest, container: "" }
          - { name: debian, os: ubuntu-latest, container: "debian:trixie" }
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - name: Debian prerequisites
        if: matrix.name == 'debian'
        run: apt-get update && apt-get install -y --no-install-recommends build-essential ca-certificates curl git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - run: cargo fmt --all --check

  clippy:
    name: clippy (${{ matrix.name }})
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, os: windows-latest, container: "" }
          - { name: debian, os: ubuntu-latest, container: "debian:trixie" }
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - name: Debian prerequisites
        if: matrix.name == 'debian'
        run: apt-get update && apt-get install -y --no-install-recommends build-essential ca-certificates curl git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.name }})
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, os: windows-latest, container: "" }
          - { name: debian, os: ubuntu-latest, container: "debian:trixie" }
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - name: Debian prerequisites
        if: matrix.name == 'debian'
        run: apt-get update && apt-get install -y --no-install-recommends build-essential ca-certificates curl git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --workspace --all-features

  msrv:
    name: msrv (${{ matrix.name }})
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, os: windows-latest, container: "" }
          - { name: debian, os: ubuntu-latest, container: "debian:trixie" }
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - name: Debian prerequisites
        if: matrix.name == 'debian'
        run: apt-get update && apt-get install -y --no-install-recommends build-essential ca-certificates curl git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the minimum supported Rust version
        id: msrv
        shell: bash
        run: |
          version="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # la-app has its own, higher rust-version (its UI dependencies need it); the core crates
      # keep the workspace MSRV (specs/006-ui-shell-signal-view/research.md R12).
      #
      # Only compiling is checked here, tests included (`--all-targets`): the tests themselves run on
      # the pinned toolchain in the `test` job, and running them a second time took longer than
      # everything else in the job together (10 minutes on Windows) without proving more.
      - run: cargo +${{ steps.msrv.outputs.version }} check --workspace --exclude la-app --all-targets --all-features

  deny:
    name: deny (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, os: windows-latest, container: "" }
          - { name: debian, os: ubuntu-latest, container: "debian:trixie" }
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - name: Debian prerequisites
        if: matrix.name == 'debian'
        run: apt-get update && apt-get install -y --no-install-recommends build-essential ca-certificates curl git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --all-features check

  # Non-blocking: reports commit subjects that do not follow Conventional Commits with a
  # component scope (see CONTRIBUTING.md). A warning only; it never blocks a merge.
  commits:
    name: commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    container: debian:trixie
    continue-on-error: true
    steps:
      - name: Debian prerequisites
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check commit subjects
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # The container user differs from the checkout owner; git refuses otherwise.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash scripts/check-commits.sh "origin/${BASE_REF}..HEAD"
