# Long fuzzing run of the session file loader (specs/003-session-file-format, SC-005).
#
# Informational, NOT a required check: it runs one million mutated inputs in a release build
# and uploads the failing input, if any, as an artifact. A shorter run (20,000 inputs) is part
# of the normal test suite and blocks merges.

name: Fuzz

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  fuzz:
    name: fuzz (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, os: windows-latest, container: "" }
          - { name: debian, os: ubuntu-latest, container: "debian:trixie" }
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    continue-on-error: true
    steps:
      - name: Debian prerequisites
        if: matrix.name == 'debian'
        run: apt-get update && apt-get install -y --no-install-recommends build-essential ca-certificates curl git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: One million mutated session files
        run: cargo test -p la-session --release --test fuzz -- --ignored --nocapture
      - name: One thousand killed saves
        run: cargo test -p la-session --release --test kill_save
        env:
          LA_KILL_ITERATIONS: "1000"
      - name: One million hostile localization operations
        run: cargo test -p la-i18n --release --test stress -- --ignored
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-failures-${{ matrix.name }}
          path: target/fuzz-failures/*
          if-no-files-found: warn
