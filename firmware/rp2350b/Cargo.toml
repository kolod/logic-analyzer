# The firmware of the 32-channel RP2350B analyzer: its own workspace, apart from the application's, so that
# the embedded target and toolchain never touch the host build. `la-fw-logic` has no hardware and is tested
# on the computer; the board crate (`la-fw`) is added with the first task that needs the board.

[workspace]
resolver = "3"
members = ["la-fw-logic"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-only"
publish = false

# The same panic-safety policy as the application (constitution Principle I): nothing the host sends may
# panic the firmware. Tests are relaxed in clippy.toml.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
