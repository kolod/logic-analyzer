[package]
name = "la-fw-logic"
version = "0.1.0"
description = "The logic of the RP2350B analyzer firmware: command handling, tables, compact coding and loss accounting, without hardware"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The protocol, shared with the driver. `default-features = false`: no `std` on the board.
la-proto = { path = "../../../crates/la-proto", default-features = false }

[lints]
workspace = true
